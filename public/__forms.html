<!doctype html>
<html>
  <body>
    <!-- Netlify Forms uchun yashirin nusxa: maydon nomlari src/lead.js orqali yuboriladigan maydonlar bilan bir xil bo'lishi shart -->
    <form name="lead" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="lead" />
      <input type="hidden" name="subject" />
      <input name="name" type="text" />
      <input name="phone" type="tel" />
      <input name="company" type="text" />
      <input name="language" type="text" />
      <input name="source" type="text" />
      <input name="utm_source" type="text" />
      <input name="utm_medium" type="text" />
      <input name="utm_campaign" type="text" />
      <input name="utm_content" type="text" />
      <input name="utm_term" type="text" />
      <input name="bot-field" />
    </form>
  </body>
</html>
